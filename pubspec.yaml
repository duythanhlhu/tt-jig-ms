name: tt_jig_ms
description: Mobile Jig Management System.
publish_to: 'none'
version: 2.0.1+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  dio: ^5.4.0
  dio_log: ^5.3.0+3
  internet_connection_checker_plus: ^2.9.1+2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_localizations: # Add this line
    sdk: flutter        # Add this line
  flutter_localization: ^0.3.3
  intl: ^0.20.2          # Add the intl package for date/number formatting
  package_info_plus: ^9.0.0
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.4
  path_provider: ^2.1.5
  json_annotation: ^4.0.0
  device_info_plus: ^12.3.0
  open_filex: ^4.7.0
  sprintf: ^7.0.0
  nb_utils: ^7.2.0
  collection: ^1.19.1
  flutter_inappwebview: ^6.1.5
  infinite_scroll_pagination: ^5.1.1
  animated_custom_dropdown: ^3.1.1
  barcode_scan2: ^4.7.2
  # flutter_reactive_ble: ^5.4.0
  # universal_ble: ^1.1.0
  bt_service: ^0.0.3
  audioplayers: ^6.5.1
  flutter_launcher_icons: ^0.13.1
  wakelock_plus: ^1.4.0
  optimize_battery: ^0.0.4
  auto_start_flutter: ^0.7.0
  shimmer: ^3.0.0

# dependency_overrides:
#   source_gen: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: 6.7.1 
  hive_generator: ^2.0.1
  source_gen: ^1.4.0
  change_app_package_name: ^1.1.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/AppIcon2.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/icons/AppIcon2.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/icons/AppIcon2.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icons/AppIcon2.png"